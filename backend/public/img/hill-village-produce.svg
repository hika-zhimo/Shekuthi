<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" role="img" aria-labelledby="title desc">
  <title id="title">A hill village and its harvest</title>
  <desc id="desc">Small white houses sit among green terraced hills. A woven basket of leafy vegetables, radishes and squash rests beside ears of corn in the foreground.</desc>
