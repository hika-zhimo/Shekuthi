      <path d="M0 8h24M12 0v8M0 8v8M24 8v8" fill="none" stroke="#000000" stroke-width="1.5"/>
    </pattern>
  </defs>
  <!-- Original Shekuthi vector art. Palette: logo green, white and black only. General landscape inspiration credited in ATTRIBUTION.md. -->
